services:
  web:
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://crusader:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/crusader
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: crusader
      POSTGRES_DB: crusader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - game-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crusader -d crusader"]
      interval: 5s
      retries: 10
volumes:
  game-data:
